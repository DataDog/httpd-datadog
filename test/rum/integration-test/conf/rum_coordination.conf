$load_datadog_module
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule mime_module modules/mod_mime.so
LoadModule include_module modules/mod_include.so

TypesConfig /dev/null
AddType text/html .html
# Keep the parent's reservation, but only inject into the HTML subrequest.
AddType text/plain .shtml
AddOutputFilter INCLUDES .shtml
<Directory "$htdoc_dir">
    Require all granted
    Options +Includes
</Directory>

DatadogAgentUrl http://localhost:8136
DatadogTracing Off
DatadogRum $enabled
<DatadogRumSettings "v6">
    DatadogRumOption applicationId "$app_id"
    DatadogRumOption clientToken "test-token"
    DatadogRumOption service "review-service"
</DatadogRumSettings>

<Location "/missing">
    ErrorDocument 404 /page.html
</Location>
<Location "/missing-proxy">
    DatadogRum On
    ErrorDocument 404 /upstream/short
</Location>
<Location "/page.html">
    DatadogRum $target_enabled
</Location>
<Location "/upstream/">
    DatadogRum $enabled
</Location>
<Location "/off/">
    DatadogRum Off
</Location>

$proxy_configuration
