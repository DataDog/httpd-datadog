$load_datadog_module
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule alias_module modules/mod_alias.so
LoadModule cgid_module modules/mod_cgid.so

ScriptSock "$script_socket"
ScriptAlias /cgi/ "$htdoc_dir/"
<Directory "$htdoc_dir">
    Require all granted
</Directory>

DatadogAgentUrl http://localhost:8136
DatadogTracing Off
DatadogRum On
<DatadogRumSettings "v6">
    DatadogRumOption applicationId "test-app"
    DatadogRumOption clientToken "test-token"
    DatadogRumOption service "review-service"
</DatadogRumSettings>
