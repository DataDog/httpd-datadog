$load_datadog_module
LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule mime_module modules/mod_mime.so

TypesConfig /dev/null
AddType application/javascript .js
AddType text/plain .txt
AddType application/json .json
AddType text/htmlish .lookalike
AddType text/html .html
AddType "text/html; charset=utf-8" .html_utf8
AddType "TeXt/HtMl; charset=UTF-8" .html_mixed

<Directory "$htdoc_dir">
    Require all granted
</Directory>

DatadogAgentUrl http://localhost:8136
DatadogTracing Off
DatadogRum On
<DatadogRumSettings "v6">
    DatadogRumOption applicationId "test-app-id-123"
    DatadogRumOption clientToken "test-client-token-456"
    DatadogRumOption site "datadoghq.com"
</DatadogRumSettings>

$proxy_configuration
