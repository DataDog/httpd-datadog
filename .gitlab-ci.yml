include:
  - local: .gitlab/devcontainer.yml
  - local: .gitlab/devcontainer-to-ghcr.yml
  - local: ".gitlab/ssi-package.yml"
  - local: ".gitlab/one-pipeline.locked.yml"

variables:
  # Inputs to .gitlab/devcontainer.yml (the dd-repo-tools shared
  # devcontainer template). DEVCONTAINER_PER_ARCH=true publishes
  # $IMAGE:amd64-$TAG and $IMAGE:arm64-$TAG; the downstream build / test
  # jobs below then pull the matching arch and run on native runners
  # (`tags: ["arch:$ARCH"]`). The cmake compile + integration-test suite
  # is too slow under qemu to run any other way.
  DEVCONTAINER_REPO_NAME: httpd-datadog
  DEVCONTAINER_PER_ARCH: "true"
  # Only build_env is hashed into the image context; nested dependencies are
  # runtime/build-job inputs and do not belong in the image-builder checkout.
  DEVCONTAINER_GIT_SUBMODULE_STRATEGY: normal
  DEVCONTAINER_GIT_SUBMODULE_PATHS: deps/nginx-datadog
  # Most jobs consume build artifacts and do not need any submodules. Build
  # jobs override this with the two top-level dependencies they compile.
  GIT_SUBMODULE_STRATEGY: none
  GIT_SUBMODULE_DEPTH: 1
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: url.https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.ddbuild.io/DataDog/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/DataDog/
  # one-pipeline OCI publishing. All four must be set explicitly: the template
  # otherwise derives them from REPO_LANG, which defaults to
  # ${CI_PROJECT_NAME##*-} == "datadog" here, yielding
  # datadog-apm-library-datadog. OCI_AGENT_REGISTRY_PACKAGE_NAME must equal
  # OCI_PACKAGE_NAME minus the "datadog-" prefix plus "-package"
  # (.verify-oci-variables enforces this).
  OCI_PACKAGE_NAME: datadog-apm-library-httpd
  OCI_AGENT_REGISTRY_PACKAGE_NAME: apm-library-httpd-package
  AGENT_REPO_PRODUCT_NAME: auto_inject-httpd
  LIB_INJECTION_NAME: dd-lib-httpd-init
  REPO_NOTIFICATION_CHANNEL: "#apm-proxy"

default:
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity

stages:
  - build
  - test
  - assemble
  - shared-pipeline
  - aws

# Template jobs (hidden, reusable)
.build-template:
  stage: build
  variables:
    # Avoid recursively cloning benchmark-only and unrelated nested modules.
    # These are the only top-level submodules used by the RUM-enabled build.
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_PATHS: "deps/dd-trace-cpp deps/inject-browser-sdk"
    GIT_SUBMODULE_UPDATE_FLAGS: "--jobs 2"
    SCCACHE_DIR: $CI_PROJECT_DIR/.cache/sccache
    SCCACHE_CACHE_SIZE: 1G
    CACHE_COMPRESSION_LEVEL: fastest
    RUSTC_WRAPPER: /usr/bin/sccache
  # The runner moves sccache's already-compressed local objects through its
  # shared S3 backend using pre-signed URLs, so ephemeral pods need no direct
  # bucket permissions. Separate writers avoid cross-architecture races.
  cache:
    key: "sccache-v1-${ARCH}"
    paths:
      - .cache/sccache/
    policy: pull-push
  needs:
    - job: devcontainer_image
      artifacts: true
  script:
    - git config --global --add safe.directory $PWD
    - >
      cmake --preset=ci-release
      -DHTTPD_DATADOG_ENABLE_RUM=ON
      -DCMAKE_TOOLCHAIN_FILE=/sysroot/${TOOLCHAIN_ARCH}-none-linux-musl/Toolchain.cmake
      -DCMAKE_C_COMPILER_LAUNCHER=sccache
      -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      -B build .
    - cmake --build build -j --verbose
    - sccache --show-stats
    - cmake --install build --prefix dist
    - mkdir -p artifacts/$ARCH upload
    - cp dist/lib/mod_datadog.so artifacts/$ARCH/
    - cp dist/lib/mod_datadog.so.debug artifacts/$ARCH/ || true
    - cd artifacts/$ARCH && zip ../../upload/mod_datadog-${ARCH}.zip mod_datadog.so && cd -
  artifacts:
    paths:
      - artifacts/$ARCH/mod_datadog.so
      - artifacts/$ARCH/mod_datadog.so.debug
      - upload/mod_datadog-${ARCH}.zip

.test-rum-template:
  stage: test
  # Same `--flag=VALUE` reasoning as the `make test-integration` recipe:
  # pytest's early arg parser runs before conftest registers these custom
  # options, so the space-separated form gets read as a positional test
  # path and skips conftest.
  script:
    - cd $CI_PROJECT_DIR/test/integration-test && uv sync --locked && uv run pytest scenarios --module-path=$CI_PROJECT_DIR/artifacts/$ARCH/mod_datadog.so --bin-path=/httpd/httpd-build/bin/apachectl --log-dir=$CI_PROJECT_DIR/logs -m requires_rum -v

# Runs the full integration-test suite via the same `make test-integration`
# entrypoint local developers use. MODULE_PATH points the target at the
# build:$ARCH artifact so the cmake build inside the recipe is skipped
# and only pytest runs.
.test-integration-template:
  stage: test
  variables:
    # The shared make entrypoint validates its devcontainer context inputs,
    # including the nginx build_env files, before running pytest.
    GIT_SUBMODULE_STRATEGY: normal
    GIT_SUBMODULE_PATHS: deps/nginx-datadog
    MODULE_PATH: $CI_PROJECT_DIR/artifacts/$ARCH/mod_datadog.so
  script:
    - make test-integration

.amd64:
  image: $DEVCONTAINER_IMAGE_AMD64_CI
  variables:
    ARCH: amd64
    TOOLCHAIN_ARCH: x86_64
  tags: ["arch:amd64"]

.arm64:
  image: $DEVCONTAINER_IMAGE_ARM64_CI
  variables:
    ARCH: arm64
    TOOLCHAIN_ARCH: aarch64
  tags: ["arch:arm64"]

.test-amd64:
  extends: .amd64
  needs:
    - job: devcontainer_image
      artifacts: true
    - job: "build:amd64"
      artifacts: true

.test-arm64:
  extends: .arm64
  needs:
    - job: devcontainer_image
      artifacts: true
    - job: "build:arm64"
      artifacts: true

build:amd64:
  extends:
    - .build-template
    - .amd64

build:arm64:
  extends:
    - .build-template
    - .arm64

test-rum:amd64:
  extends:
    - .test-rum-template
    - .test-amd64

test-rum:arm64:
  extends:
    - .test-rum-template
    - .test-arm64

test-integration:amd64:
  extends:
    - .test-integration-template
    - .test-amd64

test-integration:arm64:
  extends:
    - .test-integration-template
    - .test-arm64

.upload-template:
  stage: aws
  needs:
    - job: "build:amd64"
      artifacts: true
    - job: "build:arm64"
      artifacts: true
    - job: "test-rum:amd64"
    - job: "test-rum:arm64"
    - job: "test-integration:amd64"
    - job: "test-integration:arm64"
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/aws-cli:2.33.12
  script:
    - aws s3 cp upload/ "${S3_PATH}/" --recursive --acl public-read
    - echo "Uploaded to ${S3_PATH}/"
  after_script:
    - |
      PUBLIC_URL=$(echo "${S3_PATH}" | sed 's|s3://\([^/]*\)/|https://\1.s3.amazonaws.com/|')
      echo "Public URLs:"
      for f in upload/*; do
        echo "  ${PUBLIC_URL}/$(basename $f)"
      done
      for f in upload/*; do
        curl -sSfI "${PUBLIC_URL}/$(basename $f)" && echo "  $(basename $f) verified" || echo "  $(basename $f) not accessible"
      done

upload-branch-snapshots:
  extends: .upload-template
  variables:
    S3_PATH: s3://rum-auto-instrumentation/httpd/branch-snapshots/pipeline-${CI_PIPELINE_ID}
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

upload-snapshots:
  extends: .upload-template
  variables:
    S3_PATH: s3://rum-auto-instrumentation/httpd/snapshots/pipeline-${CI_PIPELINE_ID}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

upload-snapshots-latest:
  extends: .upload-template
  variables:
    S3_PATH: s3://rum-auto-instrumentation/httpd/snapshots/latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

configure-branch-snapshot-expiry:
  stage: aws
  tags: ["arch:amd64"]
  image: registry.ddbuild.io/images/aws-cli:2.33.12
  script:
    - |
      BUCKET=rum-auto-instrumentation
      RULE_ID=expire-httpd-branch-snapshots

      # Fetch existing lifecycle config (empty array if none)
      EXISTING=$(aws s3api get-bucket-lifecycle-configuration --bucket "$BUCKET" 2>/dev/null | jq '.Rules // []' || echo '[]')

      # Build the desired rule
      RULE=$(jq -n '{
        ID: $id,
        Filter: { Prefix: "httpd/branch-snapshots/" },
        Status: "Enabled",
        Expiration: { Days: 30 }
      }' --arg id "$RULE_ID")

      # Replace existing rule with same ID, or append
      UPDATED=$(echo "$EXISTING" | jq --argjson rule "$RULE" '
        [.[] | select(.ID != $rule.ID)] + [$rule]
      ')

      aws s3api put-bucket-lifecycle-configuration \
        --bucket "$BUCKET" \
        --lifecycle-configuration "{\"Rules\": $UPDATED}"

      echo "Lifecycle rule '$RULE_ID' configured: expire httpd/branch-snapshots/ after 30 days"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ── One-pipeline overrides ────────────────────────────────────────────
#
# These re-declare only the keys we change; everything else still comes from
# .gitlab/one-pipeline.locked.yml (do not edit that file — it is generated).

# None of the one-pipeline jobs build anything from source: they operate on the
# ssi-build artifacts plus the two scripts under .gitlab/. The repo-wide
# GIT_SUBMODULE_STRATEGY: recursive would make each of them clone
# deps/{dd-trace-cpp,inject-browser-sdk,nginx-datadog} for nothing. (The
# template already does this for the jobs it declares variables on.)
.no-submodules: &no-submodules
  GIT_SUBMODULE_STRATEGY: none

# Upstream package-oci declares no needs:, so it would be stage-gated on
# `shared-pipeline`. Its real inputs are the ssi-build jobs, which in turn gate
# on test-rum:$ARCH so an untested module never reaches installtesting.
package-oci:
  needs:
    - job: "ssi-build:amd64"
      artifacts: true
    - job: "ssi-build:arm64"
      artifacts: true
  variables:
    <<: *no-submodules

oci-internal-publish:
  variables:
    <<: *no-submodules

publishing-gate:
  variables:
    <<: *no-submodules

create-multiarch-lib-injection-image:
  variables:
    <<: *no-submodules

publish_dora_metrics:
  variables:
    <<: *no-submodules

generate-lib-init-pinned-tag-values:
  variables:
    <<: *no-submodules

internal-publish-lib-init-tags:
  variables:
    <<: *no-submodules

promote-oci-to-staging:
  variables:
    <<: *no-submodules

promote-oci-to-prod-beta:
  variables:
    <<: *no-submodules

promote-oci-to-prod:
  variables:
    <<: *no-submodules

rollout-mutable-tags-staging:
  variables:
    <<: *no-submodules

rollout-mutable-tags-prod:
  variables:
    <<: *no-submodules

rollback-mutable-tags-staging:
  variables:
    <<: *no-submodules

rollback-mutable-tags-prod:
  variables:
    <<: *no-submodules

# Needs metadata/requirements-{block,allow}.json fixtures and a gitlab-config
# allowlist entry for cloning auto_inject with CI_JOB_TOKEN. Hard-fails on unset
# REQUIREMENTS_*_JSON_PATH otherwise.
requirements_json_test:
  image: registry.ddbuild.io/images/mirror/alpine:3.23.0
  tags: ["arch:amd64"]
  stage: shared-pipeline
  needs: []
  before_script: []
  script: ['echo "skipped: no requirements fixtures yet"']
  variables:
    <<: *no-submodules

# system-tests has no httpd library, so there is nothing to configure or run.
configure_system_tests:
  image: registry.ddbuild.io/images/mirror/alpine:3.23.0
  tags: ["arch:amd64"]
  stage: shared-pipeline
  needs: []
  before_script: []
  script: ['echo "skipped: system-tests has no httpd library"']
  variables:
    <<: *no-submodules

system_tests:
  rules:
    - when: never

# Needs an ECR repository plus the
# ci.httpd-datadog.apm-ecosystems-reliability-profile SSM parameter, neither of
# which exists yet. Does not gate the OCI publish.
kubernetes-injection-test-ecr-publish:
  allow_failure: true
