# DO NOT EDIT. Synced from DataDog/dd-repo-tools by the
# dd-repo-tools devcontainer-bundle campaigner into
# `.gitlab/devcontainer.yml` — edits here will be overwritten.
#
# Shared devcontainer pipeline. One job does everything: stage the
# context, compute the tag, check the cache, build + nydusify on miss,
# emit ci-image.env for downstream jobs.
#
# Each build produces two registry tags:
#   $TAG     — OCI source, pullable from any client (laptops, the
#              public Docker Hub mirror flow, GitHub-hosted runners).
#              Exposed to consumers as DEVCONTAINER_IMAGE[_AMD64|_ARM64].
#   $TAG-ci  — nydus-converted variant for runners with a nydus
#              snapshotter. Exposed as DEVCONTAINER_IMAGE_CI
#              (or *_AMD64_CI / *_ARM64_CI under PER_ARCH).
#
# Consumer repo wires this in via:
#   variables:
#     DEVCONTAINER_REPO_NAME: my-repo
#     # optional:
#     # DEVCONTAINER_IMAGE_NAME: registry.ddbuild.io/ci/my-repo     # flat path
#     # DEVCONTAINER_PER_ARCH: "true"                               # arch matrix
#   include:
#     - local: .gitlab/devcontainer.yml
#
# DEVCONTAINER_PER_ARCH=true builds two single-arch refs ($IMAGE:amd64-$TAG
# and $IMAGE:arm64-$TAG) instead of one multi-arch manifest. Downstream
# jobs pulling the matching ref can then run on a native-arch runner,
# avoiding qemu emulation at build and consume time. The template expands
# devcontainer_image into an amd64/arm64 matrix; downstream `needs` on the
# base job name receives both non-overlapping dotenv reports.
# Default off because most repos build fast enough that the single
# multi-arch buildx run is the cheaper option.
#
# Per-repo inputs live in:
#   .devcontainer/Dockerfile          the dockerfile
#   .devcontainer/context.files       rsync --files-from list (one path per line;
#                                     '#'/blank lines are comments, stripped
#                                     before being handed to rsync)
#   .devcontainer/context.filter      optional rsync filter rules

variables:
  DEVCONTAINER_IMAGE_NAME: registry.ddbuild.io/ci/${DEVCONTAINER_REPO_NAME}/devcontainer
  DEVCONTAINER_PER_ARCH: ""
  DEVCONTAINER_GIT_SUBMODULE_STRATEGY: none
  DEVCONTAINER_GIT_SUBMODULE_PATHS: ""
  # Bootstrap image used by the devcontainer_image job. Self-published —
  # this is dd-repo-tools' own slim devcontainer image (copies only the
  # required static Nydus/registry tools onto Alpine), pinned by content
  # hash so the bootstrap never silently shifts. Bump after its Dockerfile
  # change has published the new hash.
  DEVCONTAINER_BOOTSTRAP_IMAGE: registry.ddbuild.io/ci/dd-repo-tools/devcontainer:40ad683b4475-ci

devcontainer_image:
  stage: .pre
  image: $DEVCONTAINER_BOOTSTRAP_IMAGE
  variables:
    # Image contexts rarely need every recursive submodule. Consumers that
    # need one can opt into `normal` plus an explicit path allowlist without
    # slowing every downstream job's independent checkout policy.
    GIT_SUBMODULE_STRATEGY: $DEVCONTAINER_GIT_SUBMODULE_STRATEGY
    GIT_SUBMODULE_PATHS: $DEVCONTAINER_GIT_SUBMODULE_PATHS
  needs: []
  parallel:
    matrix:
      - DEVCONTAINER_BUILD_ARCH: amd64
        DEVCONTAINER_TOOLCHAIN_ARCH: x86_64
      - DEVCONTAINER_BUILD_ARCH: arm64
        DEVCONTAINER_TOOLCHAIN_ARCH: aarch64
  rules:
    - if: '$DEVCONTAINER_PER_ARCH == "true"'
    - if: '$DEVCONTAINER_BUILD_ARCH == "amd64"'
  tags: ["arch:$DEVCONTAINER_BUILD_ARCH"]
  id_tokens:
    DDSIGN_ID_TOKEN:
      aud: image-integrity
  script:
    - |
      set -euo pipefail
      check_started=$(date +%s)

      # Guard against an empty path component in the resolved image
      # name — the most common cause is a consumer forgetting to set
      # DEVCONTAINER_REPO_NAME (default DEVCONTAINER_IMAGE_NAME embeds
      # it). Docker would accept `…/ci//devcontainer:tag` silently and
      # push to the wrong place.
      case "$DEVCONTAINER_IMAGE_NAME" in
        *//*) echo "ERROR: DEVCONTAINER_IMAGE_NAME has an empty path component ($DEVCONTAINER_IMAGE_NAME). Set DEVCONTAINER_REPO_NAME or override DEVCONTAINER_IMAGE_NAME." >&2; exit 1 ;;
      esac

      # Some bootstrap images (upstream nydus, etc.) are minimal — guard
      # each `command -v` so apt-get only runs when the tool's actually
      # missing. With dd-repo-tools' self-published bootstrap (already
      # has make + rsync baked in) this whole block is a no-op.
      missing=""
      command -v make  >/dev/null || missing="$missing make"
      command -v rsync >/dev/null || missing="$missing rsync"
      if [ -n "$missing" ]; then
        apt-get update -qq
        # shellcheck disable=SC2086
        apt-get install -y -qq --no-install-recommends $missing
      fi

      # Stage + hash via devcontainer.mk so CI and local `make` use the
      # same code. `-f` is explicit so we don't depend on the consumer's
      # root Makefile including the fragment. .devcontainer-stage-context
      # writes to .devcontainer/.staged/; .devcontainer-image-hash reads
      # from the same path and prints the 12-char tag.
      MK="-f .devcontainer/devcontainer.mk"
      # shellcheck disable=SC2086
      make $MK .devcontainer-stage-context
      ctx=.devcontainer/.staged
      # shellcheck disable=SC2086
      TAG=$(make $MK -s .devcontainer-image-hash)
      echo "Devcontainer tag: $TAG"
      echo "Builder architecture: $(uname -m)"

      # ddsign uses gRPC to reach the internal signer. Sending that connection
      # through Fabric's HTTP proxy replaces the TLS chain and makes signing
      # fail with x509: certificate signed by unknown authority.
      signer_host=image-integrity-signer.us1.ddbuild.io
      export NO_PROXY="${NO_PROXY:+$NO_PROXY,}$signer_host"
      export no_proxy="${no_proxy:+$no_proxy,}$signer_host"

      # ---- build-or-skip per arch ----
      # The slim bootstrap keeps heavyweight Vault credentials archived so
      # anonymous cache probes stay fast. Older bootstrap images already have
      # the Docker credential config in place and take the no-op path.
      enable_registry_writes() {
        local auth_archive=/opt/devcontainer-registry-auth.tar.gz
        [ -f /root/.docker/config.json ] && return
        if [ ! -f "$auth_archive" ]; then
          echo "ERROR: bootstrap image has neither registry credentials nor $auth_archive" >&2
          return 1
        fi
        echo "Cache miss: enabling registry write credentials"
        tar -xzf "$auth_archive" -C /
      }

      build_and_nydusify() {
        local ref=$1 platform=$2 arch_arg=$3
        local cache_suffix cache_ref
        enable_registry_writes
        cache_suffix=$(printf '%s' "$platform" | tr '/,' '--')
        cache_ref="${DEVCONTAINER_IMAGE_NAME}:buildcache-${cache_suffix}"
        echo "Building $ref ..."
        # shellcheck disable=SC2086
        docker buildx build \
          --platform "$platform" \
          --file "$ctx/.devcontainer/Dockerfile" \
          --build-context "repo=$ctx" \
          --cache-from "type=registry,ref=$cache_ref" \
          --cache-to "type=registry,ref=$cache_ref,mode=max" \
          $arch_arg \
          --push -t "$ref" \
          "$ctx"
        convert_and_sign "$ref" "$ref-ci" "$platform"
      }

      sign_image() {
        local ref=$1 digest attempt
        digest=$(crane digest "$ref")
        for attempt in 1 2 3; do
          if ddsign sign "$ref@$digest"; then
            return
          fi
          if ((attempt < 3)); then
            echo "Image signing failed (attempt $attempt/3); retrying..." >&2
            sleep $((attempt * 2))
          fi
        done
        return 1
      }

      convert_and_sign() {
        local source_ref=$1 target_ref=$2 platform=$3
        SKIP_SIGN=true PLATFORMS="$platform" \
          nydus-convert "$source_ref" "$target_ref"
        sign_image "$target_ref"
      }

      # A valid CI manifest must contain Nydus v6 layers. For an index, inspect
      # every platform manifest concurrently; accepting the outer tag alone
      # could silently reuse a stale plain-OCI child.
      nydus_v6_manifest() {
        jq -e '
          any(.layers[]?; .mediaType == "application/vnd.oci.image.layer.nydus.blob.v1") and
          (.annotations["containerd.io/snapshot/nydus-fs-version"] == "6")
        ' >/dev/null
      }

      nydus_cached() {
        local ref=$1 manifest image_repo digest pid status=0
        local -a digests pids=()
        manifest=$(crane manifest "$ref" 2>/dev/null) || return
        if jq -e '.layers != null' <<<"$manifest" >/dev/null; then
          nydus_v6_manifest <<<"$manifest"
          return
        fi

        mapfile -t digests < <(jq -r '.manifests[]?.digest' <<<"$manifest")
        ((${#digests[@]} > 0)) || return 1
        image_repo=${ref%:*}
        for digest in "${digests[@]}"; do
          {
            child=$(crane manifest "$image_repo@$digest" 2>/dev/null) &&
              nydus_v6_manifest <<<"$child"
          } &
          pids+=("$!")
        done
        for pid in "${pids[@]}"; do
          wait "$pid" || status=1
        done
        return "$status"
      }

      signature_cached() {
        local ref=$1 digest signature_ref
        digest=$(crane digest "$ref" 2>/dev/null) || return
        signature_ref=$(ddsign resolve "$ref@$digest" 2>/dev/null) || return
        crane digest "$signature_ref" >/dev/null 2>&1
      }

      nydus_ready() {
        nydus_cached "$1" && signature_cached "$1"
      }

      # Probe the OCI and Nydus refs concurrently. Registry latency, rather
      # than local staging/hashing, dominates the warm path.
      both_cached() {
        local source_pid ci_pid source_status=0 ci_status=0
        crane digest "$1" >/dev/null 2>&1 & source_pid=$!
        nydus_ready "$1-ci" & ci_pid=$!
        wait "$source_pid" || source_status=$?
        wait "$ci_pid" || ci_status=$?
        ((source_status == 0 && ci_status == 0))
      }

      ensure_cached() {
        local ref=$1 platform=$2 arch_arg=$3
        if both_cached "$ref"; then
          echo "Devcontainer cache hit: $ref and $ref-ci"
        elif crane digest "$ref" >/dev/null 2>&1; then
          enable_registry_writes
          if nydus_cached "$ref-ci"; then
            echo "OCI/Nydus cache hit but signature missing: signing $ref-ci"
            sign_image "$ref-ci"
          else
            echo "OCI cache hit but Nydus cache miss: regenerating $ref-ci"
            convert_and_sign "$ref" "$ref-ci" "$platform"
          fi
        else
          build_and_nydusify "$ref" "$platform" "$arch_arg"
        fi
      }

      if [ "$DEVCONTAINER_PER_ARCH" = "true" ]; then
        REF="${DEVCONTAINER_IMAGE_NAME}:${DEVCONTAINER_BUILD_ARCH}-${TAG}"
        build_arg=""
        if grep -q '^ARG ARCH' "$ctx/.devcontainer/Dockerfile"; then
          build_arg="--build-arg ARCH=${DEVCONTAINER_TOOLCHAIN_ARCH}"
        fi
        ensure_cached "$REF" "linux/${DEVCONTAINER_BUILD_ARCH}" "$build_arg"
        if [ "$DEVCONTAINER_BUILD_ARCH" = amd64 ]; then
          {
            echo "DEVCONTAINER_IMAGE_AMD64=$REF"
            echo "DEVCONTAINER_IMAGE_AMD64_CI=$REF-ci"
            echo "CI_IMAGE_HASH=$TAG"
          } > ci-image.env
        else
          {
            echo "DEVCONTAINER_IMAGE_ARM64=$REF"
            echo "DEVCONTAINER_IMAGE_ARM64_CI=$REF-ci"
            echo "CI_IMAGE_HASH=$TAG"
          } > ci-image.env
        fi
      else
        REF="${DEVCONTAINER_IMAGE_NAME}:${TAG}"
        ensure_cached "$REF" linux/amd64,linux/arm64 ""
        {
          echo "DEVCONTAINER_IMAGE=$REF"
          echo "DEVCONTAINER_IMAGE_CI=$REF-ci"
          echo "CI_IMAGE_HASH=$TAG"
        } > ci-image.env
      fi
      echo "Devcontainer image check completed in $(($(date +%s) - check_started))s"
  artifacts:
    reports:
      dotenv: ci-image.env
