devcontainer_to_public:
  stage: .pre
  image: registry.ddbuild.io/agent-delivery/dd-pkg:v0.9.6@sha256:aa20db8bf104f510a2bd4c46e941f0dfb426cb460fcbbdc5f07797de4aa51167
  tags: ["arch:amd64"]
  interruptible: false
  resource_group: devcontainer-public
  timeout: 65m
  needs:
    - job: devcontainer_image
      artifacts: true
  variables:
    DEVCONTAINER_PUBLIC_IMAGE: httpd-datadog-ci-dev
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - when: never
  script:
    - dd-pkg version
    - sh .gitlab/publish-devcontainer.sh
