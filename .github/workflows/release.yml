name: Release
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      # See .github/workflows/CI_IMAGE.md — bump via `make mirror-public-image`.
      image: datadog/docker-library:httpd-datadog-ci-bf4e353dec1442b7864fddc3c2618b8541eed4c04fe2ab88f2a4c2ebea61df91
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build
        run: make ci-build PRESET=ci-release
      - name: Export library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mod_datadog_artifact
          path: dist/lib/mod_datadog.so
      - name: Export library (debug symbol)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mod_datadog_artifact-debug
          path: dist/lib/mod_datadog.so.debug
