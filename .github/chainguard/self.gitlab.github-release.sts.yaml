# Publish the devcontainer from the mirrored main branch.
issuer: https://gitlab.ddbuild.io
subject: "project_path:DataDog/httpd-datadog:ref_type:branch:ref:main"

claim_pattern:
  project_path: "DataDog/httpd-datadog"
  ref: "main"
  ref_type: "branch"
  ref_path: "refs/heads/main"
  pipeline_source: "push"
  ci_config_ref_uri: 'gitlab\.ddbuild\.io/DataDog/httpd-datadog//\.gitlab-ci\.yml@refs/heads/main'

permissions:
  packages: write
